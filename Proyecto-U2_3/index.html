<!DOCTYPE html>
<html lang="es">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
    
        <header>
            <h1>Practica completa de javaScript y css</h1>
        </header>
        <div class="div_main">
            <p>Esta es una practica completa de javaScript y css, donde se aplican los conocimientos adquiridos en el curso de desarrollo web. A continuacion se presentan diferentes secciones que demuestren el estilo css y funcionalidad de javaScript.
            </p>
            <button class="btn" id="btn_modo">Cambiar estilo</button>
        </div>
        <div class="div_flex" id="div_papa">
            <div class="div_flexHijo amarillo">
                <img src="../Nailpedia/IMG/Imagen Principal.jpg" alt="Imagen 1">
            </div>

            <div class="div_flexHijo verde">
                <img src="../Nailpedia/IMG/imagen2.jpg" alt="Imagen 2">
            </div>

            <div class="div_flexHijo azul">
                <img src="../Nailpedia/IMG/imagen3.jpg" alt="Imagen 3">
            </div>
        
            <div class="formulario">
                <form>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingrese su nombre">
                    <br>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="Ingrese su correo electrónico">
                    <br>
                    <label for="mensaje">Contraseña:</label>
                    <input type="password" id="mensaje" name="mensaje" required placeholder="Ingrese su contraseña">
                    <br>
                    <label for="cel">Número de teléfono:</label>
                    <input type="tel" id="cel" name="cel" required placeholder="Ingrese su número de teléfono">
                    <br>
                    <label for="fecha">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" required placeholder="Ingrese su mensaje"></textarea>
                    <br>
                    <input type="submit" value="Enviar">
                </form>
            </div>
                
                <div class="div_flexHijo morado">
                    <img src="../Mi-primera-practica-U2/IMG/img1.webp" alt="Imagen 1">
                </div>

                <div class="div_flexHijo naranja">
                    <img src="../Mi-primera-practica-U2/IMG/img2.jpg" alt="Imagen 2">
                </div>

                <div class="div_flexHijo rojo">
                    <img src="../Mi-primera-practica-U2/IMG/img3.jpg" alt="Imagen 3">
                </div>
                
        </div>   

        <script src="funtion2.js"></script>

    </body>
</html>
